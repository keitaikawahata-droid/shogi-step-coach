<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>将棋ステップコーチ</title>
  <style>
    :root {
      --board-bg: #e5c088;
      --cell-border: #6d4622;
      --selected: #ffeb3b;
      --movable: #69db7c;
      --danger-target: #ff6b6b;
      --danger-attacker: #fa5252;
      --last-from: #ffd43b;
      --last-to: #ffa94d;
      --check-king: #ff49db;
      --text-color: #212529;
    }
    body {
      margin: 0;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #1e1e24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8f9fa;
      user-select: none;
      -webkit-user-select: none;
    }
    h1 {
      font-size: 1.05rem;
      margin: 2px 0 4px 0;
    }
    #app-container {
      width: 100%;
      max-width: 370px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .engine-status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 0.7rem;
      box-sizing: border-box;
    }
    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59f00;
      margin-right: 4px;
    }
    .status-badge.ready {
      background: #37b24d;
    }
    .control-panel {
      width: 100%;
      background: #2b2d42;
      border-radius: 6px;
      padding: 4px 6px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      font-size: 0.72rem;
    }
    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .setting-label {
      color: #adb5bd;
      font-size: 0.65rem;
    }
    select {
      background: #3d405b;
      color: #fff;
      border: 1px solid #6c757d;
      border-radius: 4px;
      padding: 2px 3px;
      font-size: 0.72rem;
      outline: none;
    }
    .btn-action {
      background: #495057;
      color: #fff;
      border: none;
      padding: 5px 7px;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .btn-action:active {
      background: #343a40;
    }
    .stand {
      width: 100%;
      min-height: 36px;
      background: #2b2d42;
      border-radius: 6px;
      margin: 2px 0;
      display: flex;
      align-items: center;
      padding: 2px 6px;
      box-sizing: border-box;
      font-size: 0.8rem;
    }
    .stand-label {
      color: #adb5bd;
      margin-right: 6px;
      font-size: 0.7rem;
      white-space: nowrap;
    }
    .stand-list {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .stand-piece {
      background: var(--board-bg);
      color: var(--text-color);
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid var(--cell-border);
      font-size: 0.85rem;
      touch-action: manipulation;
    }
    .stand-piece.selected {
      background: var(--selected);
      outline: 2px solid #f59f00;
    }
    .board-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 2px 0;
    }
    .file-labels {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      width: 324px;
      font-size: 0.7rem;
      color: #adb5bd;
      text-align: center;
      margin-bottom: 2px;
      padding-right: 18px;
      box-sizing: border-box;
    }
    .board-middle {
      display: flex;
      align-items: center;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      width: 324px;
      height: 324px;
      border: 2px solid var(--cell-border);
      background-color: var(--board-bg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      touch-action: manipulation;
    }
    .rank-labels {
      display: grid;
      grid-template-rows: repeat(9, 1fr);
      height: 324px;
      width: 18px;
      font-size: 0.7rem;
      color: #adb5bd;
      text-align: center;
      line-height: 36px;
    }
    .cell {
      border: 0.5px solid var(--cell-border);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--text-color);
      cursor: pointer;
      position: relative;
      box-sizing: border-box;
      transition: background-color 0.1s ease;
      touch-action: manipulation;
    }
    .cell.selected { background-color: var(--selected); }
    .cell.movable { background-color: var(--movable); }
    .cell.last-move-from { background-color: var(--last-from) !important; opacity: 0.85; }
    .cell.last-move-to { background-color: var(--last-to) !important; box-shadow: inset 0 0 0 2px #e8590c; }
    .cell.punish-attacker { background-color: var(--danger-attacker) !important; }
    .cell.punish-target { background-color: var(--danger-target) !important; }
    .cell.in-check { background-color: var(--check-king) !important; animation: blink 0.7s infinite alternate; }
    @keyframes blink { from { opacity: 0.6; } to { opacity: 1; } }
    .gote { transform: rotate(180deg); color: #9b111e; }
    .sente { color: #111111; }
    #status-box {
      margin-top: 4px;
      padding: 5px 8px;
      width: 100%;
      background-color: #2b2d42;
      border-radius: 6px;
      text-align: center;
      font-size: 0.78rem;
      min-height: 22px;
      box-sizing: border-box;
      line-height: 1.3;
    }
    #coach-card {
      width: 100%;
      background: #232738;
      border: 1px solid #3b4252;
      border-left: 4px solid #38d9a9;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 5px;
      box-sizing: border-box;
      font-size: 0.76rem;
      line-height: 1.45;
    }
    .coach-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #38d9a9;
      margin-bottom: 4px;
      font-size: 0.78rem;
    }
    .coach-badge {
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
    }
    .badge-good { background: #2b8a3e; color: #fff; }
    .badge-ok { background: #1971c2; color: #fff; }
    .badge-warn { background: #d97706; color: #fff; }
    .badge-bad { background: #c92a2a; color: #fff; }
    .coach-body { color: #eceff4; }

    /* 画面内デバッグログ用枠 */
    #debug-console {
      width: 100%;
      margin-top: 10px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px;
      font-family: monospace;
      font-size: 0.65rem;
      color: #58a6ff;
      max-height: 120px;
      overflow-y: auto;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-err { color: #f85149; }
    .log-ok { color: #3fb950; }
  </style>
  <script>
    // 画面内ログ記録関数
    window.dbgLog = function(msg, isErr, isOk) {
      console.log(msg);
      const el = document.getElementById('debug-log-content');
      if (el) {
        const span = document.createElement('div');
        if (isErr) span.className = 'log-err';
        if (isOk) span.className = 'log-ok';
        span.textContent = msg;
        el.appendChild(span);
        el.parentElement.scrollTop = el.parentElement.scrollHeight;
      }
    };
    window.onerror = function(msg, url, line) {
      dbgLog('[Error] ' + msg + ' (' + line + '行目)', true);
    };
  </script>
  <!-- Fairy-Stockfish WASM 公式ローダー -->
  <script src="./stockfish.js" onerror="dbgLog('[Error] stockfish.js の読み込みに失敗 (404等)', true)"></script>
</head>
<body>

  <div id="app-container">
    <h1>将棋ステップコーチ</h1>

    <!-- エンジンステータス -->
    <div class="engine-status-bar">
      <div>
        <span id="engine-indicator" class="status-badge"></span>
        <span id="engine-label">Fairy-Stockfish: 初期化中...</span>
      </div>
      <div id="eval-display">評価値: 0</div>
    </div>

    <!-- コントロールパネル -->
    <div class="control-panel">
      <div class="setting-group">
        <span class="setting-label">相手レベル</span>
        <select id="cpu-level">
          <option value="1">初級（手加減）</option>
          <option value="2">中級（手堅い）</option>
          <option value="3" selected>上級（本格探索・初段級）</option>
        </select>
      </div>

      <div class="setting-group">
        <span class="setting-label">アシスト（目標棋力）</span>
        <select id="assist-level">
          <option value="10k">アマ10級（大悪手のみ）</option>
          <option value="5k" selected>アマ5級（悪手を警告）</option>
          <option value="1d">アマ初段（疑問手も警告）</option>
          <option value="3d">アマ三段（厳格モード）</option>
          <option value="off">実戦（アシストなし）</option>
        </select>
      </div>

      <button class="btn-action" onclick="confirmReset()">初手から</button>
    </div>

    <!-- CPU（後手）持ち駒 -->
    <div class="stand">
      <span class="stand-label">CPU持ち駒</span>
      <div id="gote-stand" class="stand-list">なし</div>
    </div>

    <!-- 将棋盤エリア -->
    <div class="board-wrapper">
      <div class="file-labels">
        <span>9</span><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
      </div>
      <div class="board-middle">
        <div id="board"></div>
        <div class="rank-labels">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>七</span><span>八</span><span>九</span>
        </div>
      </div>
    </div>

    <!-- プレイヤー（先手）持ち駒 -->
    <div class="stand">
      <span class="stand-label">自持ち駒</span>
      <div id="sente-stand" class="stand-list">なし</div>
    </div>

    <div id="status-box">初期化中...</div>

    <!-- AIコーチ解説カード -->
    <div id="coach-card">
      <div class="coach-header">
        <span>💡 AIコーチの解説</span>
        <span id="coach-badge" class="coach-badge badge-ok">準備中</span>
      </div>
      <div id="coach-body" class="coach-body">
        エンジンの診断情報を取得しています。
      </div>
    </div>

    <!-- 画面内デバッグログ枠 -->
    <div id="debug-console">
      <div style="font-weight: bold; margin-bottom: 2px; color: #8b949e;">[エンジン診断ログ]</div>
      <div id="debug-log-content"></div>
    </div>
  </div>

  <script>
    // 診断チェック
    dbgLog('1. ブラウザ分離状態 (crossOriginIsolated): ' + self.crossOriginIsolated, self.crossOriginIsolated ? false : true, self.crossOriginIsolated ? true : false);

    const factory = window.Stockfish || window.StockfishWeb || window.FairyStockfish;
    dbgLog('2. Stockfishローダー関数: ' + (typeof factory), typeof factory !== 'function', typeof factory === 'function');

    let sfInstance = null;

    if (typeof factory === 'function') {
      try {
        dbgLog('3. エンジンインスタンス生成を開始...', false, false);
        factory({
          locateFile: (path) => {
            dbgLog('   wasm探索: ./' + path, false, false);
            return './' + path;
          }
        }).then((sf) => {
          sfInstance = sf;
          dbgLog('4. エンジン生成成功！ UCI初期化中...', false, true);
          sf.addMessageListener((line) => {
            dbgLog('   < [SF] ' + line, false, false);
            if (line === 'readyok') {
              document.getElementById('engine-indicator').classList.add('ready');
              document.getElementById('engine-label').textContent = 'Fairy-Stockfish: 稼働中';
              document.getElementById('status-box').textContent = '対局可能：あなたの番です';
            }
          });
          sf.postMessage('uci');
          sf.postMessage('setoption name UCI_Variant value shogi');
          sf.postMessage('isready');
        }).catch((err) => {
          dbgLog('[FATAL] 初期化Promiseエラー: ' + (err && err.message ? err.message : String(err)), true);
        });
      } catch (err) {
        dbgLog('[FATAL] 起動例外: ' + err.message, true);
      }
    } else {
      dbgLog('[FATAL] stockfish.js 内に起動用関数が見つかりません', true);
    }
  </script>
</body>
</html>
